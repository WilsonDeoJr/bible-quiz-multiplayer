<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bible Quiz Multiplayer</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #2c3e50, #3498db);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .quote {
      font-style: italic;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #ffffff10;
      padding: 20px;
      border-radius: 15px;
      width: 280px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }

    input {
      background-color: #fff;
      color: #333;
    }

    button {
      background-color: #f1c40f;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #f39c12;
    }
  </style>
</head>
<body>
  <h1>BIBLE QUIZ</h1>
  <div class="quote">"Your word is a lamp to my feet and a light to my path." - Psalm 119:105</div>

  <div class="container" id="setup">
    <div class="card">
      <h2>Create Game</h2>
      <input id="playerName" placeholder="Enter Your Name" />
      <input id="createNumQuestions" type="number" min="1" max="50" placeholder="Number of Questions" />
      <button onclick="createGame()">Create Game</button>
    </div>

    <div class="card">
      <h2>Join Game</h2>
      <input id="roomCode" placeholder="Enter Room Code" />
      <input id="playerNameJoin" placeholder="Enter Your Name" />
      <button onclick="joinGame()">Join Game</button>
    </div>

  <!-- GAME PANEL -->
  <div id="game" style="display:none;">
    <div id="questionBox"></div>
    <div id="optionsBox"></div>
    <h3>Players</h3>
    <ul id="playerList"></ul>
    <button onclick="startGame()">Start Game (Host Only)</button>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script>
    const socket = io('https://bible-quiz-multiplayer.onrender.com'); // Replace with your backend if needed
    let roomCodeGlobal;

    function createGame() {
      const playerName = document.getElementById('playerName').value;
      const numQuestions = parseInt(document.getElementById('createNumQuestions').value);

      if (!playerName || isNaN(numQuestions)) {
        alert("Please enter your name and number of questions.");
        return;
      }

      socket.emit('createGame', { playerName, numQuestions });
    }

    function joinGame() {
      const roomCode = document.getElementById('roomCode').value.toUpperCase();
      const playerName = document.getElementById('playerNameJoin').value;
      if (!roomCode || !playerName) {
        alert("Enter room code and your name.");
        return;
      }

      socket.emit('joinGame', { roomCode, playerName });
      roomCodeGlobal = roomCode;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'block';
    }

    function startGame() {
      socket.emit('startGame', roomCodeGlobal);
    }

    socket.on('gameCreated', (roomCode) => {
      alert('Game created! Room code: ' + roomCode);
      roomCodeGlobal = roomCode;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'block';
    });

    socket.on('playerList', (players) => {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.textContent = `${p.name} - ${p.score} pts`;
        list.appendChild(li);
      });
    });

    socket.on('newQuestion', (question) => {
      const questionBox = document.getElementById('questionBox');
      const optionsBox = document.getElementById('optionsBox');
      questionBox.textContent = question.text;
      optionsBox.innerHTML = '';

      let timer = question.timer;
      const timerDisplay = document.createElement('p');
      timerDisplay.id = 'timer';
      timerDisplay.textContent = `Time left: ${timer}s`;
      optionsBox.appendChild(timerDisplay);

      const countdown = setInterval(() => {
        timer--;
        timerDisplay.textContent = `Time left: ${timer}s`;
        if (timer <= 0) clearInterval(countdown);
      }, 1000);

      question.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.onclick = () => {
          socket.emit('submitAnswer', { roomCode: roomCodeGlobal, answerIndex: i });
        };
        optionsBox.appendChild(btn);
      });
    });

    socket.on('gameOver', (players) => {
      const questionBox = document.getElementById('questionBox');
      const optionsBox = document.getElementById('optionsBox');

      questionBox.textContent = "🎉 Game Over! Final Scores:";
      optionsBox.innerHTML = '';

      players.sort((a, b) => b.score - a.score);
      players.forEach((p, i) => {
        const pEl = document.createElement('p');
        pEl.textContent = `${i + 1}. ${p.name} - ${p.score} pts`;
        optionsBox.appendChild(pEl);
      });
    });

    socket.on('error', (msg) => alert(msg));
  </script>
</body>
</html>
