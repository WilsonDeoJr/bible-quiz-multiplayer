<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bible Quiz Multiplayer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>BIBLE QUIZ</h1>
  <div class="quote">"Your word is a lamp to my feet and a light to my path." - Psalm 119:105</div>

  <div class="container" id="setup">
    <div class="card">
      <h2>Create Game</h2>
      <input id="playerName" placeholder="Enter Your Name" />
      <input id="createNumQuestions" type="number" min="1" max="50" placeholder="Number of Questions" />
      <button onclick="createGame()">Create Game</button>
    </div>

    <div class="card">
      <h2>Join Game</h2>
      <input id="roomCode" placeholder="Enter Room Code" />
      <input id="playerNameJoin" placeholder="Enter Your Name" />
      <button onclick="joinGame()">Join Game</button>
    </div>
  </div>

  <!-- GAME PANEL -->
  <div id="game" style="display:none;">
    <h2 id="roomDisplay"></h2>
    <div id="questionBox"></div>
    <div id="optionsBox"></div>
    <h3>Players</h3>
    <ul id="playerList"></ul>
    <button onclick="startGame()">Start Game (Host Only)</button>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
