<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bible Quiz Multiplayer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #2c3e50, #3498db);
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
    }
    .hidden {
      display: none;
    }
    input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
    }
    button {
      background-color: #f1c40f;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #f39c12;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Bible Quiz</h1>

    <!-- Main Menu -->
    <div id="mainMenu">
      <button onclick="showCreateForm()">Create Game</button>
      <button onclick="showJoinForm()">Join Game</button>
    </div>

    <!-- Create Game Form -->
    <div id="createForm" class="hidden">
      <h2>Create Game</h2>
      <input id="playerName" placeholder="Your Name" />
      <input id="createNumQuestions" type="number" placeholder="Number of Questions" min="1" max="50" />
      <button onclick="createGame()">Start Game</button>
    </div>

    <!-- Join Game Form -->
    <div id="joinForm" class="hidden">
      <h2>Join Game</h2>
      <input id="roomCode" placeholder="Room Code" />
      <input id="playerNameJoin" placeholder="Your Name" />
      <button onclick="joinGame()">Join Game</button>
    </div>

    <!-- Game Area -->
    <div id="game" class="hidden">
      <h2 id="roomDisplay">Room Code: </h2>
      <div id="questionBox"></div>
      <div id="optionsBox"></div>
      <h3>Players</h3>
      <ul id="playerList"></ul>
      <button id="startGameBtn" onclick="startGame()" style="display:none;">Start Game (Host Only)</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    function showCreateForm() {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('createForm').classList.remove('hidden');
    }

    function showJoinForm() {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('joinForm').classList.remove('hidden');
    }
  </script>
</body>
</html>
