<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bible Quiz Multiplayer</title>
</head>
<body>
  <h1>Bible Quiz Multiplayer</h1>

  <div id="setup">
    <input id="playerName" placeholder="Enter Your Name" />
    <input id="numQuestions" type="number" min="1" max="50" placeholder="Number of Questions" />
    <button onclick="createGame()">Create Game</button>
  
    <hr />
  
    <input id="roomCode" placeholder="Enter Room Code" />
    <input id="playerNameJoin" placeholder="Enter Your Name to Join" />
    <button onclick="joinGame()">Join Game</button>
  </div>
  

  <div id="game" style="display:none;">
    <div id="questionBox"></div>
    <div id="optionsBox"></div>
    <h3>Players</h3>
    <ul id="playerList"></ul>
    <input id="numQuestions" type="number" placeholder="Number of questions" min="1" max="50" />
    <button onclick="startGame()">Start Game (Host Only)</button>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script>
    const socket = io('https://bible-quiz-multiplayer.onrender.com');
    let roomCodeGlobal;

  function createGame() {
   const playerName = document.getElementById('playerName').value;
   const numQuestions = parseInt(document.getElementById('numQuestions').value);
    if (!playerName || isNaN(numQuestions)) {
     alert("Enter your name and number of questions.");
    return;
        }
  socket.emit('createGame', { playerName, numQuestions });
    }



    socket.on('gameCreated', (roomCode) => {
      alert('Game created! Room code: ' + roomCode);
      roomCodeGlobal = roomCode;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'block';
    });

    function joinGame() {
      const roomCode = document.getElementById('roomCode').value.toUpperCase();
      const playerName = document.getElementById('playerNameJoin').value;
      socket.emit('joinGame', { roomCode, playerName });
      roomCodeGlobal = roomCode;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'block';
}


    socket.on('playerList', (players) => {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.textContent = `${p.name} - ${p.score} pts`;
        list.appendChild(li);
      });
    });

    function startGame() {
      socket.emit('startGame', roomCodeGlobal);
    }

    socket.on('newQuestion', (question) => {
  const questionBox = document.getElementById('questionBox');
  const optionsBox = document.getElementById('optionsBox');
  questionBox.textContent = question.text;
  optionsBox.innerHTML = '';

  let timer = question.timer;
  const timerDisplay = document.createElement('p');
  timerDisplay.id = 'timer';
  timerDisplay.textContent = `Time left: ${timer}s`;
  optionsBox.appendChild(timerDisplay);

  const countdown = setInterval(() => {
    timer--;
    timerDisplay.textContent = `Time left: ${timer}s`;
    if (timer <= 0) clearInterval(countdown);
  }, 1000);

  question.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.onclick = () => {
      socket.emit('submitAnswer', { roomCode: roomCodeGlobal, answerIndex: i });
    };
    optionsBox.appendChild(btn);
  });
});

socket.on('gameOver', (players) => {
  const questionBox = document.getElementById('questionBox');
  const optionsBox = document.getElementById('optionsBox');

  questionBox.textContent = "🎉 Game Over! Final Scores:";
  optionsBox.innerHTML = '';

  players.sort((a, b) => b.score - a.score);
  players.forEach((p, i) => {
    const pEl = document.createElement('p');
    pEl.textContent = `${i + 1}. ${p.name} - ${p.score} pts`;
    optionsBox.appendChild(pEl);
  });
});


    socket.on('error', (msg) => alert(msg));
  </script>
</body>
</html>
